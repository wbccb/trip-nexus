use_default_settings: true

server:
  # 必须设置密钥，随便写一段长字符串
  secret_key: "your_random_secret_key_here"
  # 允许 API 访问
  base_url: http://localhost:8080/
  # 解决 403/CORS 问题：允许所有来源访问（调试用）
  method: "GET"

search:
  # 开启 JSON 格式输出，这是项目调用的基础
  formats:
    - html
    - json

# 解决 429 报错：关闭内置的访问频率限制器
enabled_plugins:
  - 'Hash plugin'
  - 'Self-contained images'

# 重点：关闭限制器，防止本地调试被封
limiter: false